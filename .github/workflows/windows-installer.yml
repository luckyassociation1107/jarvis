name: Windows installer

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  installer:
    name: Build JARVIS Windows setup
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund
        env:
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip

      - name: Build the browser UI
        run: npm run build
        env:
          VITE_BASE_PATH: /
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip

      - name: Validate a release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $package = Get-Content 'package.json' -Raw | ConvertFrom-Json
          $version = [string]$package.version
          $tagVersion = $env:GITHUB_REF_NAME -replace '^v', ''
          if ($tagVersion -ne $version) {
            throw "Release tag '$env:GITHUB_REF_NAME' must match package.json version v$version."
          }

      - name: Package the desktop app as a Windows installer
        run: npx electron-builder --win nsis --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Verify installer output
        shell: pwsh
        run: |
          $package = Get-Content 'package.json' -Raw | ConvertFrom-Json
          $version = [string]$package.version
          $installer = "release\JARVIS-Setup-$version-x64.exe"
          if (-not (Test-Path $installer)) {
            Write-Host 'Files found in the release directory:'
            if (Test-Path 'release') { Get-ChildItem 'release' -Recurse | Select-Object FullName }
            throw "Expected installer was not created: $installer"
          }
          Get-FileHash $installer -Algorithm SHA256 | Format-List
          Write-Host "Created $installer"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Windows-Installer
          path: release/JARVIS-Setup-*.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  publish-release:
    name: Attach installer to GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: installer
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the installer artifact
        uses: actions/download-artifact@v4
        with:
          name: JARVIS-Windows-Installer
          path: release-assets

      - name: Publish installer
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/JARVIS-Setup-*.exe
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
