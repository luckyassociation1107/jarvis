# Builds jarvis.exe and publishes it as an artifact.
#
# The most useful job here is `check`. The Dart in this repo was written without
# a Flutter SDK available, so nothing in launcher/ has ever been compiled. This
# runs `flutter analyze` on every push and turns that unknown into either a
# clean bill of health or a list of the mistakes.
#
# Runs on:
#   push to main, when launcher/ or this file changes
#   any PR touching launcher/
#   manually, from the Actions tab
name: Build launcher

on:
  push:
    branches: [main]
    paths:
      - 'launcher/**'
      - '.github/workflows/build-launcher.yml'
  pull_request:
    paths:
      - 'launcher/**'
      - '.github/workflows/build-launcher.yml'
  workflow_dispatch:

# A push that lands while an older build is still running makes that older build
# pointless — its output is already superseded. Cancel it rather than queue.
concurrency:
  group: launcher-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------
  # The check. Cheap, fast, and the one job that can tell us the Dart is
  # actually valid. Fails the build on any analyzer error.
  # ---------------------------------------------------------------------
  check:
    name: Analyze
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The host scaffolding is not committed — flutter create generates it,
      # and analyze needs a complete project to resolve imports against.
      - name: Generate host scaffolding
        run: flutter create --project-name jarvis_launcher --platforms=windows,android --org com.jarvis .

      # The repo's copies are authoritative: the generated manifest has no
      # QUERY_ALL_PACKAGES, and MainActivity.kt carries the platform channel.
      - name: Restore platform overrides
        run: |
          git checkout -- android/app/src/main/AndroidManifest.xml
          git checkout -- android/app/src/main/kotlin/com/jarvis/jarvis_launcher/MainActivity.kt

      # flutter create writes a test/widget_test.dart that pumps `MyApp`,
      # which this project does not have — it would fail analyze forever.
      # The repo ships test/workspace_test.dart instead.
      - name: Drop the generated default test
        run: rm -f test/widget_test.dart

      - name: flutter pub get
        run: flutter pub get

      # The analyzer resolves imports through .dart_tool/package_config.json,
      # not through pubspec.yaml. If package:ffi is absent from that file, every
      # DynamicLibrary/Pointer/calloc name comes back undefined no matter what
      # pubspec says — which is exactly what happened on the first run.
      - name: Confirm package:ffi is available to the analyzer
        run: |
          if grep -q '"name":"ffi"' .dart_tool/package_config.json; then
            echo "package:ffi is in package_config.json"
          else
            echo "::error::package:ffi is MISSING from .dart_tool/package_config.json"
            echo "--- resolved packages ---"
            grep -o '"name":"[^"]*"' .dart_tool/package_config.json | sort -u
            exit 1
          fi

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      # The pure-Dart logic: byte formatting and the fuzzy matcher. No platform
      # channel and no binding, so these run on the Linux runner.
      - name: Test
        run: flutter test

      # Informational only. The code was written without a formatter, so this
      # will almost certainly list files; it does not fail the build.
      - name: Format report
        run: dart format --output=none lib

  # ---------------------------------------------------------------------
  # The Windows build. One job, one build, two artifacts: the portable exe
  # bundle and the installer. Inno Setup is installed here rather than in a
  # separate job because rebuilding the whole app just to compile an .iss is
  # eight wasted minutes.
  # ---------------------------------------------------------------------
  windows:
    name: Windows
    runs-on: windows-latest
    needs: check
    defaults:
      run:
        working-directory: launcher
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate host scaffolding
        run: flutter create --project-name jarvis_launcher --platforms=windows --org com.jarvis .

      - name: Restore platform overrides
        run: |
          git checkout -- android/app/src/main/AndroidManifest.xml
          git checkout -- android/app/src/main/kotlin/com/jarvis/jarvis_launcher/MainActivity.kt

      # hotkey.cpp is a plain C++ module with no Flutter dependency, so it has
      # to be added to the generated build by hand. Without this line the
      # linker fails on RegisterJarvisHotkey with an unresolved external.
      - name: Wire hotkey.cpp into the generated build
        shell: python
        run: |
          import re, pathlib
          p = pathlib.Path('windows/runner/CMakeLists.txt')
          s = p.read_text()
          if 'hotkey.cpp' in s:
              print('already wired')
          else:
              m = re.search(r'add_executable\(\$\{BINARY_NAME\}[^)]*\)', s, re.S)
              assert m, 'could not find add_executable in CMakeLists.txt'
              block = m.group(0)
              patched = block.replace(
                  '"flutter_window.cpp"',
                  '"hotkey.cpp"\n  "flutter_window.cpp"', 1)
              assert patched != block, 'flutter_window.cpp not found in add_executable'
              p.write_text(s[:m.start()] + patched + s[m.end():])
              print('added hotkey.cpp to add_executable')

      - name: flutter pub get
        run: flutter pub get

      - name: Build
        run: flutter build windows --release

      # The exe is not runnable from build/ — it needs its DLLs and the data/
      # folder beside it. Ship the whole Release directory.
      - name: Package portable
        run: |
          $out = 'jarvis-launcher-windows'
          Remove-Item -Recurse -Force $out -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item -Recurse build/windows/x64/runner/Release/* $out
          Compress-Archive -Path $out -DestinationPath "$out.zip"
          Write-Host "packaged: $out.zip"

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-launcher-windows
          path: launcher/jarvis-launcher-windows.zip
          retention-days: 30
          if-no-files-found: error

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      # jarvis.iss reads build\windows\x64\runner\Release\* and writes to
      # ..\dist relative to itself, i.e. launcher/dist\jarvis-setup.exe.
      - name: Compile installer
        run: |
          $iscc = Get-ChildItem 'C:\Program Files*\Inno Setup*\ISCC.exe' -ErrorAction SilentlyContinue |
                  Select-Object -First 1 -ExpandProperty FullName
          if (-not $iscc) { throw 'ISCC.exe not found after install' }
          & $iscc 'installer\jarvis.iss'

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-installer
          path: launcher/dist/jarvis-setup.exe
          retention-days: 30
          if-no-files-found: error
