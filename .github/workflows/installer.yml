# Build the Windows installer (.exe) for J.A.R.V.I.S.
#
# Two jobs, in this order, because the second one is slow and there is no point
# spending four minutes on a Windows runner to learn that the interface does not
# build:
#
#   1. `verify`  — Ubuntu. Builds the interface and runs the desktop self-test,
#                  which checks the static server, the one-click setup page, the
#                  brain's startup contract and the WebSocket origin rules using
#                  plain Node. No Electron, no display, no model server needed.
#   2. `installer` — Windows. Builds the same interface, runs the self-test
#                  again, packages with electron-builder, then launches the
#                  *packaged application* in self-test mode. Asar archives,
#                  utility processes, the static server and the origin handshake
#                  are all verified against the real build before anything is
#                  published — a build whose window opens and whose bridge
#                  refuses its socket fails the run instead of reaching a user.
#
# What comes out: an NSIS setup .exe (per-user install, no admin prompt, desktop
# and Start Menu shortcuts, uninstaller in Add/Remove Programs).
#
# It runs on every push to any branch, so a branch under review can produce a
# downloadable installer without merging first; `paths` keeps that to changes
# that can actually affect the build. A `v*` tag additionally checks that the
# tag matches `package.json`, then attaches the installer to a GitHub release.
#
# Every gating command pipes through `tee` and, on failure, through
# scripts/ci-report.mjs, which reprints the tail as a check annotation. Job logs
# are a zip served from results-receiver.actions.githubusercontent.com, and that
# host is unreachable from some networks (a sandbox fails the download with
# `EOF`), which leaves "exit code 1" as the only clue. Annotations are served
# from api.github.com and survive that.
#
# The app is not code-signed: there is no certificate in this repository, so
# Windows SmartScreen shows "unknown publisher" the first time. Signing is a
# `win.certificateFile` entry away for anyone who has one; see docs/DESKTOP.md.

name: Build Windows installer

on:
  push:
    branches: ['**']
    tags: ['v*']
    paths:
      - 'desktop/**'
      - 'bridge/**'
      - 'scripts/**'
      - 'src/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'tsconfig*.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/installer.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - 'bridge/**'
      - 'scripts/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/installer.yml'
  workflow_dispatch:

concurrency:
  group: installer-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The CUDA build of onnxruntime-node is a 200 MB download for a provider this
  # app never uses (speech runs on the browser's ONNX/WASM path). The project's
  # own PowerShell launcher sets this too; the flag has to live here as well
  # because `npm ci` runs before any of our code does.
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip

jobs:
  verify:
    name: Verify (web build + desktop self-test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          npm ci --no-audit --no-fund 2>&1 | tee ci.log || {
            node scripts/ci-report.mjs 'npm ci' ci.log; exit 1; }

      - name: Build the interface
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee ci.log || {
            node scripts/ci-report.mjs 'npm run build' ci.log; exit 1; }

      - name: Desktop packaging self-test
        shell: bash
        run: |
          set -o pipefail
          npm run test:desktop 2>&1 | tee ci.log || {
            node scripts/ci-report.mjs 'npm run test:desktop' ci.log; exit 1; }

      - name: Installer and endpoint contracts
        shell: bash
        run: |
          set -o pipefail
          npm run test:installers 2>&1 | tee ci.log || {
            node scripts/ci-report.mjs 'npm run test:installers' ci.log; exit 1; }

      # Informational, and deliberately not a gate. `npm run smoke` is the
      # project's own end-to-end script, and two of its checks assert the
      # *Windows* runtime archive while a third needs a live model server — it
      # exits non-zero on a clean Linux runner (and on a clean checkout of this
      # repository) with nothing actually broken. Failing the build on it would
      # teach everyone to ignore the build.
      - name: Bridge smoke test (informational)
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          npm run smoke 2>&1 | tee ci.log || {
            node scripts/ci-report.mjs 'npm run smoke (informational)' ci.log; exit 1; }

  installer:
    name: Windows installer
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          npm ci --no-audit --no-fund 2>&1 | tee ci.log || {
            node scripts/ci-report.mjs 'npm ci' ci.log; exit 1; }

      - name: Build the interface
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee ci.log || {
            node scripts/ci-report.mjs 'npm run build' ci.log; exit 1; }

      - name: Desktop packaging self-test
        shell: bash
        run: |
          set -o pipefail
          npm run test:desktop 2>&1 | tee ci.log || {
            node scripts/ci-report.mjs 'npm run test:desktop' ci.log; exit 1; }

      # A release tag that disagrees with package.json produces an installer
      # whose version is not the version in its own name. Cheaper to refuse it.
      - name: Validate a release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $package = Get-Content 'package.json' -Raw | ConvertFrom-Json
          $version = [string]$package.version
          $tagVersion = $env:GITHUB_REF_NAME -replace '^v', ''
          if ($tagVersion -ne $version) {
            throw "Release tag '$env:GITHUB_REF_NAME' must match package.json version v$version."
          }

      - name: Package the installer
        shell: bash
        env:
          # No certificate in this repository, and electron-builder should not go
          # looking for one on the runner or try to publish on a tag build.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          set -o pipefail
          npx electron-builder --win nsis --x64 --publish never 2>&1 | tee ci.log || {
            node scripts/ci-report.mjs 'electron-builder' ci.log; exit 1; }

      - name: Check the installer exists
        shell: pwsh
        run: |
          try {
            $setup = Get-ChildItem release -Filter 'JARVIS-Setup-*.exe' | Select-Object -First 1
            if (-not $setup) {
              Write-Host 'Files found in the release directory:'
              if (Test-Path 'release') { Get-ChildItem 'release' -Recurse | Select-Object FullName }
              throw 'electron-builder produced no installer'
            }
            $mb = [math]::Round($setup.Length / 1MB, 1)
            Write-Host "installer: $($setup.Name) ($mb MB)"
            if ($setup.Length -lt 40MB) { throw "the installer is only $mb MB — the app files did not get packed" }
            Get-FileHash $setup.FullName -Algorithm SHA256 | Format-List
          } catch {
            Write-Host "::error::installer check failed: $($_.Exception.Message)"
            Write-Host '::error::see the "Package the installer" step for the electron-builder output'
            exit 1
          }

      # The real proof: the packaged application, launched from the unpacked
      # build, must serve its interface, start the bridge out of the asar
      # archive, and accept the handshake. A `Start-Process -Wait` would also
      # wait for the bridge the app starts, so a failure that leaves a child
      # alive would hang the job instead of failing it — hence the polling
      # loop, the deadline, and the tree kill at the end.
      - name: Run the packaged application in self-test mode
        shell: pwsh
        timeout-minutes: 10
        run: |
          # The data folder (and therefore the log) lives outside the install,
          # under the runner's local app data, so it survives a reinstall.
          $log = Join-Path $env:LOCALAPPDATA 'JARVIS/logs/desktop.log'
          try {
            $exe = Get-ChildItem release/win-unpacked -Filter '*.exe' |
              Where-Object { $_.Name -notlike 'Uninstall*' } |
              Select-Object -First 1
            if (-not $exe) { throw 'no packaged executable found' }
            Write-Host "running $($exe.FullName) --self-test"

            $process = Start-Process -FilePath $exe.FullName -ArgumentList '--self-test' -PassThru
            $deadline = (Get-Date).AddMinutes(6)
            $seen = 0
            while (-not $process.HasExited -and (Get-Date) -lt $deadline) {
              Start-Sleep -Seconds 10
              $process.Refresh()
              # Print each new line as it appears: a self-test that fails after
              # ninety seconds should be readable as it goes, not only at the end.
              if (Test-Path $log) {
                $lines = @(Get-Content $log)
                if ($lines.Count -gt $seen) {
                  $lines[$seen..($lines.Count - 1)] | ForEach-Object { Write-Host $_ }
                  $seen = $lines.Count
                }
              }
            }

            if (-not $process.HasExited) {
              Write-Host "::error::the packaged self-test did not exit within six minutes"
              if (Test-Path $log) { node scripts/ci-report.mjs 'packaged self-test did not finish' $log }
              & taskkill /PID $process.Id /T /F | Out-Null
              exit 1
            }

            if (Test-Path $log) {
              Write-Host '--- packaged self-test log ---'
              Get-Content $log | Select-Object -Last 60 | ForEach-Object { Write-Host $_ }
            }
            if ($process.ExitCode -ne 0) {
              if (Test-Path $log) { node scripts/ci-report.mjs "packaged self-test exit $($process.ExitCode)" $log }
              throw "the packaged app failed its self-test (exit $($process.ExitCode))"
            }
            Write-Host 'packaged self-test passed'
          } catch {
            Write-Host "::error::packaged self-test failed: $($_.Exception.Message)"
            exit 1
          }

      # `always()` on purpose: the installer is the deliverable, and it exists
      # before the self-test runs. A red run should still hand a maintainer the
      # .exe it built — that is the difference between "the packaged app is
      # broken" and "the packaged app is broken and I cannot look at it".
      - name: Upload the installer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Windows-Installer
          path: |
            release/JARVIS-Setup-*.exe
            release/*.blockmap
          # The .exe is already compressed; re-compressing it wastes minutes.
          compression-level: 0
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Attach the installer to the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: installer
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: JARVIS-Windows-Installer
          path: release-assets

      - name: Publish the installer
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/JARVIS-Setup-*.exe
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            Windows installer attached below.

            Windows may show a SmartScreen warning the first time: the build is
            not code-signed. Click **More info** → **Run anyway**.

            The installer does not bundle Ollama or the model weights. The app
            downloads them on first launch, from the same one-click setup page
            `npm start` uses, into `%LOCALAPPDATA%\JARVIS`.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
